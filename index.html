<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LUMERIX — Operation Deadline</title><style>
:root{--bg:#081320;--panel:#122337;--line:#2b4157;--cyan:#57d5cf;--gold:#f3c56c;--txt:#edf5ff;--muted:#b1c2d0;--red:#ff8888}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#1c354c,var(--bg) 65%);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}.wrap{max-width:980px;margin:auto;padding:26px 20px 70px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}.brand{font-size:25px;font-weight:900;letter-spacing:3px}.brand span{color:var(--cyan)}.tag{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800}h1{font-size:clamp(29px,5vw,53px);line-height:1.1;margin:12px 0}h2{font-size:25px;margin:10px 0}h3{margin:22px 0 8px;color:var(--gold);font-size:17px}.lead{font-size:18px;color:var(--muted);max-width:750px}.card{background:rgba(18,35,55,.96);border:1px solid var(--line);border-radius:16px;padding:22px;margin:17px 0;box-shadow:0 12px 30px #0002}.brief{border-left:4px solid var(--cyan)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#0a1b2d;border:1px solid var(--line);border-radius:10px;padding:14px}.stat strong{display:block;font-size:24px;color:var(--cyan)}.stat small{color:var(--muted)}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea,select{background:#081828;color:var(--txt);border:1px solid #476078;border-radius:9px;padding:11px 12px;width:100%;font:inherit}textarea{min-height:78px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--cyan)}button{background:var(--cyan);color:#05202b;border:0;border-radius:10px;padding:12px 20px;font-weight:850;font-size:15px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.ghost{background:transparent;border:1px solid var(--cyan);color:var(--cyan)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.choice{display:flex;align-items:center;gap:9px;background:#0b1b2c;padding:11px;border:1px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer}.choice input{width:auto;accent-color:var(--cyan)}.pill{display:inline-block;background:#123d49;border:1px solid #276775;border-radius:100px;padding:5px 11px;color:var(--cyan);font-size:13px}.error{background:#4a242c;border:1px solid #aa5b66;padding:13px;border-radius:9px;color:#ffd8dc;margin:14px 0}.success{background:#153d32;border:1px solid #3b997f;padding:13px;border-radius:9px;margin:14px 0}.muted{color:var(--muted)}.small{font-size:13px}.divider{height:1px;background:var(--line);margin:20px 0}.step{font-size:14px;color:var(--gold);font-weight:800;letter-spacing:1px}.progress{height:9px;background:#23374b;border-radius:10px;overflow:hidden;margin:10px 0 25px}.progress div{height:100%;background:var(--cyan);transition:width .4s}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.columns{grid-template-columns:1fr}.wrap{padding:15px 12px 45px}header{align-items:flex-start;gap:12px}.brand{font-size:19px}.card{padding:16px}}.optionline{display:grid;grid-template-columns:30px 1fr auto auto;gap:12px;align-items:center;padding:11px;border-bottom:1px solid var(--line)}.optionline input{width:20px}.hint{color:var(--gold);font-size:14px}.chip{padding:5px 9px;border:1px solid var(--line);border-radius:7px}.hidden{display:none}

.board{display:grid;gap:10px}.boardrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(145px,240px);gap:12px;align-items:center;padding:13px;background:#0b1b2c;border:1px solid var(--line);border-radius:10px}.boardrow label{margin:0}.slot{border:1px dashed #4c7586;background:#0a1b2d;padding:12px;border-radius:10px}.sortable{list-style:none;padding:0;display:grid;gap:9px}.sortable li{background:#0b1b2c;border:1px solid #426074;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}.sortable li .txt{flex:1}.mini{padding:7px 12px;background:#24485b;color:#f0fbff}.mini:disabled{opacity:.25}.badge{color:var(--gold);font-weight:800}.good{color:#77e8ba}.bad{color:#ffa4a4}.feedbacklist{margin:8px 0;padding-left:22px}.feedbacklist li{margin:5px 0}.choice input{min-width:18px}.notice{padding:12px;border-radius:10px;background:#0a2b3c;border:1px solid #2d7e8d}.score{font-size:35px;font-weight:900;color:var(--cyan)}@media(max-width:580px){.boardrow{grid-template-columns:1fr}.optionline{grid-template-columns:24px 1fr;gap:8px}.optionline span{grid-column:2}}
</style></head><body><div class="wrap"><header><div><div class="brand">LUMERIX<span> / </span>ESCAPE</div><div class="tag">OPERATION DEADLINE</div></div><span class="pill" id="teamBadge">MANAŽÉRSKA MISIA</span></header><main id="app"><section class="card"><h1>Dokážete zachrániť výrobný plán?</h1><p>Vašou úlohou je pripraviť plán a zvládnuť päť manažérskych výziev.</p></section></main></div><script>
'use strict';
const app=document.getElementById('app'), badge=document.getElementById('teamBadge');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='lumerix_v3_active';
const rooms=['','STRATENÉ INFORMÁCIE','NEREÁLNY CIEĽ','PYRAMÍDA PLÁNOV','MANAŽÉRSKY TREZOR','KONTROLNÝ ALARM'];
const max={1:20,2:20,3:20,4:25,5:15};
const measures=[['A','Nadčasová výroba',8000,60],['B','Externý dodávateľ',15000,150],['C','Prenájom zariadenia',20000,200],['D','Školenie pracovníkov',5000,20],['E','Modernizácia logistiky',10000,0]];
const actions={
 A:[['A1','Schváliť nadčasové hodiny','Výroba'],['A2','Rozdeliť zmeny medzi pracovníkov','Výroba'],['A3','Vykonať dodatočnú výrobu','Výroba']],
 B:[['B1','Preveriť dostupnosť externého dodávateľa','Nákup'],['B2','Potvrdiť objednávku a termín dodania','Nákup'],['B3','Prevziať a skontrolovať dodávku','Logistika']],
 C:[['C1','Vybrať dostupné zariadenie na prenájom','Nákup'],['C2','Zabezpečiť inštaláciu zariadenia','Výroba'],['C3','Spustiť dodatočnú výrobu','Výroba']],
 D:[['D1','Určiť pracovníkov na školenie','Ľudské zdroje'],['D2','Uskutočniť školenie','Ľudské zdroje'],['D3','Overiť pripravenosť pracovníkov','Výroba']],
 E:[['E1','Zmapovať logistické oneskorenia','Logistika'],['E2','Upraviť spôsob expedície','Logistika'],['E3','Overiť priebeh expedície','Logistika']]
};
const RESULTS_ENDPOINT='https://script.google.com/macros/s/AKfycbx0lUcLLypMFss7ml5EpKrFpNzpReqLkmZM9D1BvHzUODR8q_alUfmT9HlV5O2X10bL/exec';
let s=null,order=[],seq5=[];
function store(){if(s)localStorage.setItem(key,JSON.stringify(s));}
function showIntro(){badge.textContent='MANAŽÉRSKA MISIA';app.innerHTML=`<div class="tag">OPERATION DEADLINE · MANAŽÉRSKA SIMULÁCIA</div><h1>Dokážete zachrániť výrobný plán?</h1><p class="lead">Spoločnosť LUMERIX musí zabezpečiť 1 200 svietidiel do 20 pracovných dní. Výroba nestíha, oddelenia nespolupracujú a rozpočet je obmedzený. Rozhodnutia vášho tímu určia, či objednávku splníte.</p><div class="grid"><div class="stat"><strong>5</strong><small>nadväzujúcich miestností</small></div><div class="stat"><strong>100</strong><small>možných bodov</small></div><div class="stat"><strong>1</strong><small>spoločný manažérsky plán</small></div></div><div class="card"><h2>Vytvorte tím</h2><label>Názov tímu</label><input id="team" placeholder="Napr. Plánovači"><label>Mená členov (oddeľte čiarkou, max. 5)</label><textarea id="members" placeholder="Jana Nováková, Peter Kováč"></textarea><button onclick="start()">ZAČAŤ MISIU →</button></div>${localStorage.getItem(key)?'<div class="card"><button class="ghost" onclick="continueGame()">POKRAČOVAŤ V ROZHRANEJ MISII →</button></div>':''}`;}
function start(){let name=$('team').value.trim(),members=$('members').value.split(',').map(v=>v.trim()).filter(Boolean);if(!name||members.length<1||members.length>5){alert('Zadajte názov tímu a 1 až 5 členov.');return;}s={id:'LUM-'+Date.now().toString(36).toUpperCase(),name,members,room:1,score:{},tries:{},answers:{},finished:false,started:new Date().toISOString()};store();render();}
function continueGame(){try{s=JSON.parse(localStorage.getItem(key));if(!s||!s.room)throw Error();render()}catch(e){alert('Rozhraná hra sa nenašla.');}}
function shell(content){badge.textContent=s.name;const n=s.room;app.innerHTML=`<div class="step">MIESTNOSŤ ${n} / 5</div><div class="progress"><div style="width:${(n-1)*20}%"></div></div><h1>${rooms[n]}</h1>${content}<div id="feedback"></div><button id="submit" onclick="submitRoom()">OVERIŤ A POKRAČOVAŤ →</button>`;window.scrollTo(0,0);}
function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`;}
function num(id,hint){return `<input id="${id}" type="number" placeholder="${hint||'Zadajte číslo'}">`}
function opt(id,options){return `<select id="${id}"><option value="">— Vyberte —</option>${options.map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join('')}</select>`;}
function pick(id,choices,multi=false){return choices.map(([v,t])=>`<label class="choice"><input name="${id}" type="${multi?'checkbox':'radio'}" value="${v}">${esc(t)}</label>`).join('');}
function get(id){return $(id)?.value??''}
function checked(name){return [...document.querySelectorAll(`[name="${name}"]:checked`)].map(e=>e.value).sort();}
function matchRows(rows,cats,prefix){return `<div class="board">${rows.map(([id,t])=>`<div class="boardrow"><span><b>${id}</b> · ${esc(t)}</span>${opt(prefix+id,cats)}</div>`).join('')}</div>`;}
function render(){if(s.finished){finish();return;}switch(s.room){case 1:r1();break;case 2:r2();break;case 3:r3();break;case 4:r4();break;case 5:r5();break;}}
function r1(){let rows=[['A','Obchodné oddelenie odovzdáva objednávky neskoro.'],['B','Výrobné linky vyrobia spolu 55 svietidiel denne.'],['C','Dopyt zákazníkov v Európe rastie.'],['D','Na mimoriadne opatrenia je dostupných 30 000 €.'],['E','Časť pracovníkov nemá potrebnú kvalifikáciu.'],['F','Konkurencia pripravuje nový výrobok.']];shell(`<p class="lead">Záznamy oddelení sa pomiešali. Roztrieďte všetkých šesť správ podľa významu pre plánovanie.</p>`+card('1.1 · Diagnostická tabuľa · 12 bodov',matchRows(rows,[['problem','Interný problém'],['resource','Dostupný zdroj alebo kapacita'],['opportunity','Externá príležitosť'],['threat','Externá hrozba']],'cat'))+card('1.2 · Tri kroky procesu plánovania · 8 bodov',`<p>Zoraďte tri hlavné fázy procesu plánovania z učebnice. Posúvajte kartičky šípkami.</p><div id="order1"></div>`));order=['implement','analysis','choice'];drawOrder('order1',order,[['analysis','Analýza východiskovej situácie'],['choice','Výber najvhodnejšieho variantu plánu'],['implement','Implementácia plánu']]);}
function drawOrder(id,arr,items){const labels=Object.fromEntries(items);$(id).innerHTML=`<ol class="sortable">${arr.map((v,i)=>`<li><span class="badge">${i+1}.</span><span class="txt">${esc(labels[v])}</span><button class="mini" ${i===0?'disabled':''} onclick="move('${id}',${i},-1)">↑</button><button class="mini" ${i===arr.length-1?'disabled':''} onclick="move('${id}',${i},1)">↓</button></li>`).join('')}</ol>`;}
function move(id,i,d){const arr=id==='order1'?order:seq5;[arr[i],arr[i+d]]=[arr[i+d],arr[i]];if(id==='order1')drawOrder(id,arr,[['analysis','Analýza východiskovej situácie'],['choice','Výber najvhodnejšieho variantu plánu'],['implement','Implementácia plánu']]);else drawOrder(id,arr,seq5Items);}
function r2(){shell(`<p class="lead">Objednávka má 1 200 kusov a termín 20 pracovných dní. Linka A vyrobí 35 ks denne a linka B 20 ks denne.</p>`+card('2.1 · Overte výrobný cieľ · 10 bodov',`<label>Celková kapacita oboch liniek za 20 dní</label>${num('cap','Počet kusov')}<label>Koľko kusov chýba?</label>${num('missing','Počet kusov')}`)+card('2.2 · Zostavte SMART cieľ · 10 bodov',`<p>Vytvorte cieľ z parametrov. Nie všetky ponúkané hodnoty sú správne.</p><label>Čo musí spoločnosť zabezpečiť?</label>${opt('goal',[['deliver','Vyrobiť alebo zabezpečiť dodanie svietidiel'],['grow','Stať sa úspešnejšou firmou'],['marketing','Zvýšiť počet reklamných kampaní']])}<label>Koľko kusov?</label>${opt('qty',[['1000','1 000'],['1100','1 100'],['1200','1 200']])}<label>Dokedy?</label>${opt('days',[['10','Do 10 pracovných dní'],['20','Do 20 pracovných dní'],['30','Do 30 pracovných dní']])}<label>Podľa čoho budete cieľ kontrolovať?</label>${opt('kpi',[['pieces','Počet zabezpečených kusov oproti plánu'],['feel','Celkový dojem manažéra'],['likes','Počet reakcií na sociálnych sieťach']])}`));}
function r3(){let rows=[['A','Smerovanie spoločnosti na štyri roky'],['B','Ročný plán modernizácie výroby'],['C','Úlohy na zajtrajšiu zmenu'],['D','Dlhodobé investičné priority'],['E','Ročný plán vzdelávania'],['F','Týždenný harmonogram výroby']];shell(`<p class="lead">Zostavte sústavu plánov tak, aby každé rozhodnutie patrilo na správnu úroveň.</p>`+card('3.1 · Priraďte úroveň plánovania · 12 bodov',matchRows(rows,[['S','Strategická'],['T','Taktická'],['O','Operatívna']],'plan'))+card('3.2 · Typy plánov · 8 bodov',`<p>Priraďte každému príkladu typ plánu.</p>`+matchRows([['G','Jednorazový projekt nákupu novej linky'],['H','Pravidelne používaný postup údržby zariadení'],['I','Plán jednorazového presťahovania skladu'],['J','Pravidlá pravidelnej kontroly kvality']],[['one','Jednorazový'],['standing','Stály']],'type')));}
function r4(){shell(`<p class="lead">Potrebujete minimálne 100 dodatočných svietidiel. Na opatrenia máte 30 000 €. Zostavte realizovateľný plán a priraďte zodpovednosť.</p>`+card('4.1 · Vyberte opatrenia · 10 bodov',measures.map(([k,n,c,p])=>`<label class="optionline"><input type="checkbox" name="measure" value="${k}" onchange="budget()"><b>${k} · ${n}</b><span>${c.toLocaleString('sk-SK')} €</span><span>+${p} ks</span></label>`).join('')+`<div class="grid" style="margin-top:15px"><div class="stat"><strong id="totalCost">0 €</strong><small>Náklady</small></div><div class="stat"><strong id="totalCap">0 ks</strong><small>Kapacita navyše</small></div><div class="stat"><strong id="balance">30 000 €</strong><small>Zostatok rozpočtu</small></div></div><p class="notice">Systém uzná každú kombináciu, ktorá splní kapacitu a rozpočet.</p>`)+card('4.2 · Vytvorte realizačný postup · 15 bodov',`<p>Po výbere opatrení kliknite na <b>ZOSTAVIŤ PLÁN</b>. Dostanete kroky pre svoje konkrétne opatrenia. Usporiadajte ich a priraďte zodpovedné oddelenia.</p><button class="ghost" onclick="makePlan()" type="button">ZOSTAVIŤ PLÁN →</button><div id="planning"></div>`));}
function budget(){let selected=checked('measure'),cost=0,cap=0;for(const m of measures)if(selected.includes(m[0])){cost+=m[2];cap+=m[3]}$('totalCost').textContent=cost.toLocaleString('sk-SK')+' €';$('totalCap').textContent=cap+' ks';$('balance').textContent=(30000-cost).toLocaleString('sk-SK')+' €';return {selected,cost,cap};}
function makePlan(){const {selected,cost,cap}=budget();if(!selected.length){alert('Najskôr vyberte opatrenia.');return;}if(cost>30000||cap<100){alert('Vybrané opatrenia zatiaľ nespĺňajú rozpočet alebo kapacitu.');return;}s.planSelection=selected;const all=selected.flatMap(k=>actions[k]);let html='<p class="notice">Kroky usporiadajte v rámci každého opatrenia od prípravy po realizáciu. Ku každému priraďte zodpovednosť.</p>';for(const k of selected){html+=`<div class="card"><h3>Opatrenie ${k}: ${esc(measures.find(m=>m[0]===k)[1])}</h3>`;const shuffled=[...actions[k]].reverse();html+=matchRows(shuffled.map(x=>[x[0],x[1]]),[['1','1. krok'],['2','2. krok'],['3','3. krok']],'order_'+k+'_');html+=`<h3>Zodpovedné oddelenia</h3>`+matchRows(shuffled.map(x=>[x[0],x[1]]),[['Nákup','Nákup'],['Výroba','Výroba'],['Logistika','Logistika'],['Ľudské zdroje','Ľudské zdroje']],'owner_'+k+'_');html+='</div>';}html+='<p class="hint">Najprv pripravte podmienky, potom zabezpečte realizáciu a nakoniec overte výsledok.</p>';$('planning').innerHTML=html;store();}
const seq5Items=[['detect','Zistiť príčinu a rozsah odchýlky'],['contact','Zabezpečiť chýbajúci materiál alebo náhradné dodanie'],['revise','Upraviť harmonogram a zodpovednosti'],['monitor','Denne kontrolovať plnenie upraveného plánu']];
function r5(){let chosen=s.answers[4]?.selection||[], names=chosen.map(k=>measures.find(m=>m[0]===k)?.[1]).join(', ');shell(`<p class="lead">Po desiatich pracovných dňoch bolo plánovaných 600 kusov, skutočnosť je iba 480 kusov. Kontrola zistila oneskorenú dodávku materiálu.</p>`+card('Váš pôvodný plán',`<p><b>Vybrané opatrenia:</b> ${esc(names)}</p><p><b>Dodatočná kapacita:</b> ${esc(s.answers[4]?.cap)} ks · <b>Náklady:</b> ${esc(s.answers[4]?.cost?.toLocaleString('sk-SK'))} €</p>`)+card('5.1 · Vypočítajte odchýlku · 6 bodov',`<label>Absolútna odchýlka (skutočnosť mínus plán)</label>${num('delta','So znamienkom')}<label>Percentuálne plnenie plánu</label>${num('percent','Bez znaku %')}`)+card('5.2 · Zostavte nápravný postup · 6 bodov',`<p>Štyri vhodné kroky sú pomiešané. Zoraďte ich do účinného manažérskeho postupu.</p><div id="order5"></div>`)+card('5.3 · Priraďte kontrolný ukazovateľ · 3 body',`<label>Čo treba merať?</label>${opt('monitorMetric',[['pieces','Počet zabezpečených kusov oproti aktualizovanému plánu'],['followers','Počet sledovateľov spoločnosti'],['mood','Spokojnosť vedenia bez merania']])}<label>Ako často?</label>${opt('monitorFreq',[['daily','Denne'],['yearly','Raz ročne'],['never','Až po skončení objednávky']])}`));seq5=['monitor','revise','contact','detect'];drawOrder('order5',seq5,seq5Items);}
function evaluate(){const checks=[];const add=(label,ok,points)=>checks.push({label,ok:!!ok,points});let answer={};if(s.room===1){const expected={A:'problem',B:'resource',C:'opportunity',D:'resource',E:'problem',F:'threat'};for(const k of Object.keys(expected))add('Zaradenie správy '+k,get('cat'+k)===expected[k],2);add('Poradie procesu plánovania',order.join(',')==='analysis,choice,implement',8);answer={categories:Object.fromEntries(Object.keys(expected).map(k=>[k,get('cat'+k)])),process:[...order]};}
if(s.room===2){add('Výrobná kapacita',Number(get('cap'))===1100,5);add('Chýbajúce kusy',Number(get('missing'))===100,5);add('Konkrétny cieľ',get('goal')==='deliver',3);add('Merateľné množstvo',get('qty')==='1200',3);add('Časové ohraničenie',get('days')==='20',2);add('Kontrolný ukazovateľ',get('kpi')==='pieces',2);answer={cap:get('cap'),missing:get('missing'),goal:get('goal'),qty:get('qty'),days:get('days'),kpi:get('kpi')};}
if(s.room===3){const expected={A:'S',B:'T',C:'O',D:'S',E:'T',F:'O'};for(const k of Object.keys(expected))add('Plán '+k,get('plan'+k)===expected[k],2);const types={G:'one',H:'standing',I:'one',J:'standing'};for(const k of Object.keys(types))add('Typ plánu '+k,get('type'+k)===types[k],2);answer={plans:Object.fromEntries(Object.keys(expected).map(k=>[k,get('plan'+k)])),types:Object.fromEntries(Object.keys(types).map(k=>[k,get('type'+k)]))};}
if(s.room===4){let {selected,cost,cap}=budget();add('Kapacita aspoň 100 kusov',cap>=100,5);add('Dodržanie rozpočtu 30 000 €',cost<=30000&&selected.length>0,5);let steps={};if(!s.planSelection||selected.join(',')!==s.planSelection.join(',')){for(let i=0;i<3;i++)add('Zostavenie realizačného plánu '+(i+1),false,5);}else{for(const k of selected){steps[k]={};for(const a of actions[k]){steps[k][a[0]]={order:get('order_'+k+'_'+a[0]),owner:get('owner_'+k+'_'+a[0])};}}for(let i=0;i<3;i++){let good=selected.every(k=>{const a=actions[k][i];return get('order_'+k+'_'+a[0])===String(i+1)&&get('owner_'+k+'_'+a[0])===a[2]});add('Realizačný krok '+(i+1),good,5);}}answer={selection:selected,cost,cap,steps};}
if(s.room===5){add('Absolútna odchýlka',Number(get('delta'))===-120,3);add('Percento plnenia',Number(get('percent'))===80,3);for(let i=0;i<4;i++)add('Nápravný krok '+(i+1),seq5[i]===seq5Items[i][0],1.5);add('Kontrolný ukazovateľ',get('monitorMetric')==='pieces',2);add('Frekvencia kontroly',get('monitorFreq')==='daily',1);answer={delta:get('delta'),percent:get('percent'),sequence:[...seq5],metric:get('monitorMetric'),frequency:get('monitorFreq')};}
return {checks,answer};}
function submitRoom(){let n=s.room,{checks,answer}=evaluate(),incorrect=checks.filter(c=>!c.ok),maxRoom=max[n];s.tries[n]=(s.tries[n]||0)+1;s.answers[n]=answer;store();if(incorrect.length){const missing=incorrect.map(c=>c.label);$('feedback').innerHTML=`<div class="error"><b>Plán ešte nie je pripravený.</b><p>Skontrolujte tieto časti:</p><ul class="feedbacklist">${missing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="hint">Môžete odpovede upraviť a skúsiť to znova.</p></div>`;$('feedback').scrollIntoView({behavior:'smooth',block:'center'});return;}const penalty=Math.min(6,Math.max(0,s.tries[n]-1)*2);s.score[n]=Math.max(0,maxRoom-penalty);s.room++;if(n===5){s.finished=true;s.ended=new Date().toISOString();}store();render();}
async function sendResults(){
 if(!s||!s.finished||s.sent)return;
 const status=document.getElementById('syncStatus');
 if(status)status.textContent='Odosielanie výsledku…';
 const total=Object.values(s.score).reduce((a,b)=>a+b,0);
 const payload={teamName:s.name,members:s.members.join(', '),teamId:s.id,
  room1:s.score[1]||0,room2:s.score[2]||0,room3:s.score[3]||0,
  room4:s.score[4]||0,room5:s.score[5]||0,total,
  answers:s.answers,attempts:s.tries,started:s.started,ended:s.ended};
 try{
  await fetch(RESULTS_ENDPOINT,{method:'POST',mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  s.sent=true;store();
  if(status)status.textContent='Výsledok bol odoslaný. Zápis do tabuľky musí potvrdiť vyučujúci.';
  const btn=document.getElementById('retrySend');if(btn)btn.hidden=true;
 }catch(e){
  if(status)status.textContent='Odoslanie sa nepodarilo. Skúste to znova.';
  const btn=document.getElementById('retrySend');if(btn)btn.hidden=false;
 }
}
function finish(){badge.textContent=s.name;const total=Object.values(s.score).reduce((a,b)=>a+b,0);app.innerHTML=`<div class="tag">MANAŽÉRSKA MISIA SPLNENÁ</div><h1>🔓 MISSION COMPLETED</h1><p class="lead">Tím <b>${esc(s.name)}</b> úspešne dokončil všetkých päť miestností.</p><div class="card"><div class="score">${total} / 100 bodov</div><p>Všetky úlohy boli vyhodnotené podľa rovnakých vopred stanovených pravidiel.</p><div class="board">${[1,2,3,4,5].map(i=>`<div class="boardrow"><span>${i}. ${rooms[i]}</span><b>${s.score[i]??0} / ${max[i]} bodov</b></div>`).join('')}</div><p class="muted small">Body zohľadňujú aj počet opakovaných pokusov.</p></div><div class="card"><p id="syncStatus" class="muted">Pripravuje sa odoslanie výsledku…</p><button id="retrySend" class="ghost" hidden onclick="sendResults()">ZNOVA ODOSLAŤ VÝSLEDOK</button></div><button onclick="window.print()">VYTLAČIŤ VÝSLEDOK</button>`;window.scrollTo(0,0);if(s.sent){$("syncStatus").textContent="Výsledok už bol odoslaný. Zápis do tabuľky musí potvrdiť vyučujúci.";}else{sendResults();}}
showIntro();
</script></body></html>
